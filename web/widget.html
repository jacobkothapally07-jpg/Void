<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Floating Core Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #ff9900;
            --gold-bright: #ffaa00;
            --gold-glow: rgba(255, 150, 0, 0.7);
            --gold-dim: rgba(255, 140, 0, 0.2);
            --cyan: #00f0ff;
            --bg-glass: rgba(10, 14, 22, 0.88);
            --font-display: "Orbitron", sans-serif;
            --font-mono: "Share Tech Mono", monospace;
            --font-ui: "Rajdhani", sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        html, body {
            width: 100%;
            height: 100%;
            background: transparent !important;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: var(--font-ui);
            -webkit-app-region: drag; /* Makes the entire widget draggable on desktop */
        }

        .widget-container {
            width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding: 10px;
        }

        /* Top HUD Telemetry Pill */
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 250px;
            padding: 4px 12px;
            background: rgba(14, 18, 26, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid var(--gold-dim);
            border-radius: 14px;
            font-family: var(--font-display);
            font-size: 9px;
            letter-spacing: 1.5px;
            color: var(--gold);
            margin-bottom: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            transition: all 0.2s ease;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #00ffaa;
            box-shadow: 0 0 8px #00ffaa;
            display: inline-block;
            margin-right: 4px;
        }

        /* Circular Arc Reactor Housing */
        .reactor-box {
            position: relative;
            width: 230px;
            height: 230px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-app-region: no-drag; /* Allows clicking the core without moving */
        }

        /* Outer HUD Rotating Tech Ring */
        .tech-ring {
            position: absolute;
            width: 226px;
            height: 226px;
            border-radius: 50%;
            border: 1.5px dashed rgba(255, 160, 0, 0.4);
            animation: rotateCounter 28s linear infinite;
            pointer-events: none;
        }

        .tech-ring-2 {
            position: absolute;
            width: 216px;
            height: 216px;
            border-radius: 50%;
            border: 1px solid rgba(255, 140, 0, 0.25);
            border-top-color: var(--gold);
            border-bottom-color: var(--gold);
            animation: rotateClock 16s linear infinite;
            pointer-events: none;
        }

        /* The Main Holographic Image Core */
        .core-image {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: url('/reactor_core.webp') center center no-repeat;
            background-size: cover;
            filter: drop-shadow(0 0 20px var(--gold-glow));
            animation: rotateClock 40s linear infinite;
            transition: all 0.3s ease;
            position: relative;
        }

        /* Central Glowing Energy Flare */
        .energy-flare {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 10%, #ffaa00 50%, transparent 80%);
            box-shadow: 0 0 35px var(--gold), 0 0 70px rgba(255, 150, 0, 0.8);
            opacity: 0.85;
            animation: pulseEnergy 2.5s ease-in-out infinite;
            pointer-events: none;
        }

        /* Interactive Animation States */
        .reactor-box.listening .core-image {
            filter: drop-shadow(0 0 35px rgba(255, 50, 20, 0.95)) brightness(1.2);
            animation: rotateClock 8s linear infinite;
        }
        .reactor-box.listening .energy-flare {
            background: radial-gradient(circle, #ffffff 15%, #ff3b30 55%, transparent 80%);
            box-shadow: 0 0 50px #ff3b30, 0 0 90px rgba(255, 50, 20, 0.9);
            animation: pulseEnergy 1.0s ease-in-out infinite;
        }

        .reactor-box.thinking .core-image {
            filter: drop-shadow(0 0 40px #00f0ff) brightness(1.3);
            animation: rotateClock 4s linear infinite;
        }

        .reactor-box.speaking .core-image {
            filter: drop-shadow(0 0 35px var(--gold-glow)) brightness(1.25);
            animation: rotateClock 12s linear infinite;
        }
        .reactor-box.speaking .energy-flare {
            animation: pulseEnergy 0.8s ease-in-out infinite;
        }

        @keyframes rotateClock {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes rotateCounter {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        @keyframes pulseEnergy {
            0% { transform: scale(0.92); opacity: 0.75; }
            50% { transform: scale(1.15); opacity: 1.0; }
            100% { transform: scale(0.92); opacity: 0.75; }
        }

        /* Floating Subtitle / Transcript Pill */
        .subtitles {
            width: 290px;
            background: rgba(10, 14, 22, 0.92);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 160, 0, 0.35);
            border-radius: 16px;
            padding: 8px 14px;
            margin-top: 8px;
            font-family: var(--font-ui);
            font-size: 12.5px;
            color: #ffeedd;
            line-height: 1.4;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8), 0 0 15px rgba(255,160,0,0.15);
            opacity: 0;
            transform: translateY(8px);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 90px;
            overflow-y: auto;
            -webkit-app-region: no-drag;
            user-select: text;
        }
        .subtitles.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Bottom Control Buttons */
        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            -webkit-app-region: no-drag;
        }

        .pill-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 160, 0, 0.25);
            color: var(--gold);
            font-family: var(--font-mono);
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .pill-btn:hover {
            background: rgba(255, 160, 0, 0.2);
            border-color: var(--gold);
            box-shadow: 0 0 10px var(--gold-glow);
        }

        /* Hidden Input Box */
        .input-bar {
            width: 280px;
            display: none;
            margin-top: 8px;
            background: rgba(12, 16, 24, 0.95);
            border: 1px solid var(--gold);
            border-radius: 18px;
            padding: 6px 14px;
            box-shadow: 0 0 20px rgba(255, 160, 0, 0.3);
            -webkit-app-region: no-drag;
        }
        .input-bar input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-family: var(--font-ui);
            font-size: 14px;
            font-weight: 500;
        }
        .input-bar input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }
    </style>
</head>
<body>
    <div class="widget-container">
        <!-- Telemetry Header -->
        <div class="hud-header">
            <div><span class="status-dot" id="statusDot"></span><span id="statusText">JARVIS // ONLINE</span></div>
            <div id="telemetry">CPU 0% | 100%⚡</div>
        </div>

        <!-- Arc Reactor Glowing Orb Core -->
        <div class="reactor-box" id="reactorBox" onclick="toggleMic()" title="Click to speak or drag widget anywhere">
            <div class="tech-ring"></div>
            <div class="tech-ring-2"></div>
            <div class="core-image"></div>
            <div class="energy-flare"></div>
        </div>

        <!-- Quick Subtitle Pill -->
        <div class="subtitles" id="subtitles">Standing by, Sir.</div>

        <!-- Hidden Quick Command Input -->
        <div class="input-bar" id="inputBar">
            <input type="text" id="cmdInput" placeholder="Type command... (Enter to send)" />
        </div>

        <!-- Widget Control Bar -->
        <div class="btn-row">
            <button class="pill-btn" onclick="toggleInput()">⌨️ TYPE</button>
            <button class="pill-btn" onclick="askQuick('what time is it')">⏱️ TIME</button>
            <button class="pill-btn" onclick="askQuick('solve the coding problem on screen and paste it')">⚡ CODE</button>
            <button class="pill-btn" onclick="openFullHUD()">🖥️ FULL</button>
        </div>
    </div>

    <script>
        const reactor = document.getElementById("reactorBox");
        const subtitles = document.getElementById("subtitles");
        const statusText = document.getElementById("statusText");
        const statusDot = document.getElementById("statusDot");
        const telemetry = document.getElementById("telemetry");
        const inputBar = document.getElementById("inputBar");
        const cmdInput = document.getElementById("cmdInput");

        let isListening = false;
        let isSpeaking = false;
        let recognition = null;
        let subtitleTimeout = null;

        function showSubtitle(text, duration = 4500) {
            subtitles.innerText = text;
            subtitles.classList.add("visible");
            clearTimeout(subtitleTimeout);
            if (duration > 0) {
                subtitleTimeout = setTimeout(() => {
                    subtitles.classList.remove("visible");
                }, duration);
            }
        }

        function setStatus(state, label) {
            reactor.className = "reactor-box " + state;
            statusText.innerText = label;
            if (state === "listening") {
                statusDot.style.background = "#ff3b30";
                statusDot.style.boxShadow = "0 0 10px #ff3b30";
            } else if (state === "thinking") {
                statusDot.style.background = "#00f0ff";
                statusDot.style.boxShadow = "0 0 10px #00f0ff";
            } else if (state === "speaking") {
                statusDot.style.background = "#ffaa00";
                statusDot.style.boxShadow = "0 0 10px #ffaa00";
            } else {
                statusDot.style.background = "#00ffaa";
                statusDot.style.boxShadow = "0 0 8px #00ffaa";
            }
        }

        // Web Speech Recognition for Chrome / WKWebView
        function initSpeech() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) {
                showSubtitle("Speech recognition active via system mic.", 3000);
                return;
            }
            recognition = new SpeechRec();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = "en-US";

            recognition.onstart = () => {
                isListening = true;
                setStatus("listening", "LISTENING...");
                showSubtitle("🎙️ Listening... speak anytime", 0);
            };

            recognition.onresult = (e) => {
                if (isSpeaking) return;
                let text = "";
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    text += e.results[i][0].transcript;
                }
                text = text.trim();
                if (text) {
                    showSubtitle(text, 0);
                    if (e.results[e.results.length - 1].isFinal) {
                        handleCommand(text);
                    }
                }
            };

            recognition.onerror = () => {
                setStatus("idle", "JARVIS // ONLINE");
            };

            recognition.onend = () => {
                isListening = false;
                if (!isSpeaking) {
                    setStatus("idle", "JARVIS // ONLINE");
                }
            };
        }

        function toggleMic() {
            if (!recognition) initSpeech();
            if (!recognition) return;
            if (isListening) {
                try { recognition.stop(); } catch(e) {}
                setStatus("idle", "JARVIS // ONLINE");
            } else {
                try { recognition.start(); } catch(e) {}
            }
        }

        async function handleCommand(query) {
            setStatus("thinking", "THINKING...");
            showSubtitle("⚡ Executing: " + query, 0);

            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: query })
                });
                const data = await res.json();
                const reply = (data && data.response) ? data.response : "Done, Sir.";

                setStatus("speaking", "SPEAKING...");
                showSubtitle(reply, 6000);

                // Wait for speech to complete
                isSpeaking = true;
                while (true) {
                    await new Promise(r => setTimeout(r, 400));
                    try {
                        const s = await fetch("/api/speaking_status");
                        const sData = await s.json();
                        if (!sData.is_speaking) break;
                    } catch(e) { break; }
                }
                isSpeaking = false;
                setStatus("idle", "JARVIS // ONLINE");
                if (recognition) {
                    try { recognition.start(); } catch(e) {}
                }
            } catch (err) {
                setStatus("idle", "JARVIS // ONLINE");
                showSubtitle("Reconnected to local core, Sir.", 3000);
            }
        }

        function toggleInput() {
            if (inputBar.style.display === "block") {
                inputBar.style.display = "none";
            } else {
                inputBar.style.display = "block";
                cmdInput.focus();
            }
        }

        cmdInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && cmdInput.value.trim()) {
                const val = cmdInput.value.trim();
                cmdInput.value = "";
                inputBar.style.display = "none";
                handleCommand(val);
            } else if (e.key === "Escape") {
                inputBar.style.display = "none";
            }
        });

        function askQuick(text) {
            handleCommand(text);
        }

        function openFullHUD() {
            fetch("/api/wakeup");
            showSubtitle("Opening Full Screen HUD, Sir...", 2500);
        }

        // Live telemetry updates
        async function updateStats() {
            try {
                const res = await fetch("/api/stats");
                const d = await res.json();
                if (d && d.status === "success") {
                    const cpu = d.cpu ? d.cpu.estimated_utilization : "0%";
                    const batt = d.battery ? d.battery.percent : "100%";
                    telemetry.innerText = `CPU ${cpu} | ${batt}⚡`;
                }
            } catch(e) {}
        }
        setInterval(updateStats, 4000);
        updateStats();

        // Initialize speech on load
        window.addEventListener("DOMContentLoaded", () => {
            initSpeech();
            try { recognition.start(); } catch(e) {}
            showSubtitle("J.A.R.V.I.S. Core Floating Widget Active", 3500);
        });
    </script>
</body>
</html>
