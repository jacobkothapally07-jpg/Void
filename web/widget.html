<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Holographic Core</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #ff9900;
            --gold-bright: #ffaa00;
            --gold-glow: rgba(255, 150, 0, 0.7);
            --gold-dim: rgba(255, 140, 0, 0.2);
            --cyan: #00f0ff;
            --cyan-glow: rgba(0, 240, 255, 0.6);
            --font-display: "Orbitron", sans-serif;
            --font-mono: "Share Tech Mono", monospace;
            --font-ui: "Rajdhani", sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        html, body {
            width: 100%;
            height: 100%;
            background: transparent !important;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: var(--font-ui);
            -webkit-app-region: drag; /* Draggable anywhere on desktop */
        }

        .widget-container {
            width: 330px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding: 8px;
        }

        /* Top HUD Telemetry Pill */
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 250px;
            padding: 4px 12px;
            background: rgba(8, 12, 18, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid var(--gold-dim);
            border-radius: 14px;
            font-family: var(--font-display);
            font-size: 9px;
            letter-spacing: 1.5px;
            color: var(--gold);
            margin-bottom: 6px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8), 0 0 10px rgba(255,150,0,0.2);
            transition: all 0.2s ease;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #00ffaa;
            box-shadow: 0 0 8px #00ffaa;
            display: inline-block;
            margin-right: 4px;
        }

        /* Circular Arc Reactor Housing */
        .reactor-box {
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
        }
        .reactor-box:active {
            cursor: grabbing;
        }

        /* Audio Visualizer Wave Ring (24 radiating bars) */
        .visualizer-ring {
            position: absolute;
            width: 236px;
            height: 236px;
            border-radius: 50%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .audio-bar {
            position: absolute;
            width: 2px;
            height: 6px;
            background: rgba(255, 170, 0, 0.45);
            border-radius: 2px;
            transform-origin: bottom center;
            transition: height 0.08s ease, background 0.15s ease;
        }

        /* Outer HUD Rotating Tech Rings */
        .tech-ring {
            position: absolute;
            width: 226px;
            height: 226px;
            border-radius: 50%;
            border: 1.5px dashed rgba(255, 160, 0, 0.45);
            animation: rotateCounter 28s linear infinite;
            pointer-events: none;
        }

        .tech-ring-2 {
            position: absolute;
            width: 216px;
            height: 216px;
            border-radius: 50%;
            border: 1px solid rgba(255, 140, 0, 0.25);
            border-top-color: var(--gold-bright);
            border-bottom-color: var(--gold-bright);
            animation: rotateClock 16s linear infinite;
            pointer-events: none;
        }

        /* The Main Holographic Image Core */
        .core-image {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: url('/reactor_core.webp') center center no-repeat;
            background-size: cover;
            filter: drop-shadow(0 0 24px var(--gold-glow));
            animation: rotateClock 42s linear infinite;
            transition: all 0.3s ease;
            position: relative;
        }

        /* Central Glowing Energy Flare */
        .energy-flare {
            position: absolute;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 15%, #ffaa00 55%, transparent 80%);
            box-shadow: 0 0 40px var(--gold), 0 0 80px rgba(255, 150, 0, 0.85);
            opacity: 0.88;
            animation: pulseEnergy 2.5s ease-in-out infinite;
            pointer-events: none;
        }

        /* Dynamic Interactive States */
        .reactor-box.listening .core-image {
            filter: drop-shadow(0 0 45px rgba(255, 60, 20, 0.95)) brightness(1.25);
            animation: rotateClock 7s linear infinite;
        }
        .reactor-box.listening .energy-flare {
            background: radial-gradient(circle, #ffffff 20%, #ff3b30 60%, transparent 80%);
            box-shadow: 0 0 60px #ff3b30, 0 0 100px rgba(255, 60, 20, 0.9);
            animation: pulseEnergy 0.9s ease-in-out infinite;
        }

        .reactor-box.thinking .core-image {
            filter: drop-shadow(0 0 45px #00f0ff) brightness(1.35);
            animation: rotateClock 3.5s linear infinite;
        }

        .reactor-box.speaking .core-image {
            filter: drop-shadow(0 0 42px var(--gold-glow)) brightness(1.3);
            animation: rotateClock 10s linear infinite;
        }
        .reactor-box.speaking .energy-flare {
            animation: pulseEnergy 0.75s ease-in-out infinite;
        }

        @keyframes rotateClock {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes rotateCounter {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        @keyframes pulseEnergy {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.2); opacity: 1.0; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }

        /* Floating Subtitle / Transcript Pill */
        .subtitles {
            width: 290px;
            background: rgba(8, 12, 18, 0.92);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 160, 0, 0.4);
            border-radius: 16px;
            padding: 8px 14px;
            margin-top: 8px;
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 600;
            color: #ffeedd;
            line-height: 1.45;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.85), 0 0 18px rgba(255,150,0,0.2);
            opacity: 0;
            transform: translateY(8px);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 90px;
            overflow-y: auto;
            -webkit-app-region: no-drag;
            user-select: text;
        }
        .subtitles.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Bottom Quick Action Bar */
        .btn-row {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            -webkit-app-region: no-drag;
        }

        .pill-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 160, 0, 0.25);
            color: var(--gold);
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .pill-btn:hover {
            background: rgba(255, 160, 0, 0.2);
            border-color: var(--gold);
            box-shadow: 0 0 10px var(--gold-glow);
        }

        /* Hidden Input Box */
        .input-bar {
            width: 280px;
            display: none;
            margin-top: 8px;
            background: rgba(12, 16, 24, 0.96);
            border: 1px solid var(--gold);
            border-radius: 18px;
            padding: 6px 14px;
            box-shadow: 0 0 20px rgba(255, 160, 0, 0.35);
            -webkit-app-region: no-drag;
        }
        .input-bar input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-family: var(--font-ui);
            font-size: 14px;
            font-weight: 600;
        }
        .input-bar input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }
    </style>
</head>
<body>
    <div class="widget-container">
        <!-- Telemetry Header -->
        <div class="hud-header">
            <div><span class="status-dot" id="statusDot"></span><span id="statusText">JARVIS // ONLINE</span></div>
            <div id="telemetry">CPU 0% | 100%⚡</div>
        </div>

        <!-- Arc Reactor Glowing Orb Core -->
        <div class="reactor-box" id="reactorBox" onclick="toggleInput()" title="Click to type or drag widget anywhere">
            <div class="visualizer-ring" id="visRing"></div>
            <div class="tech-ring"></div>
            <div class="tech-ring-2"></div>
            <div class="core-image"></div>
            <div class="energy-flare"></div>
        </div>

        <!-- Quick Subtitle Pill -->
        <div class="subtitles" id="subtitles">Standing by, Sir.</div>

        <!-- Hidden Quick Command Input -->
        <div class="input-bar" id="inputBar">
            <input type="text" id="cmdInput" placeholder="Type command... (Enter to send)" />
        </div>

        <!-- Widget Control Bar -->
        <div class="btn-row">
            <button class="pill-btn" onclick="toggleInput()">⌨️ TYPE</button>
            <button class="pill-btn" onclick="askQuick('what time is it')">⏱️ TIME</button>
            <button class="pill-btn" onclick="askQuick('solve the coding problem on screen and paste it')">⚡ CODE</button>
            <button class="pill-btn" onclick="askQuick('what is on my screen right now')">👁️ SCREEN</button>
        </div>
    </div>

    <script>
        const reactor = document.getElementById("reactorBox");
        const subtitles = document.getElementById("subtitles");
        const statusText = document.getElementById("statusText");
        const statusDot = document.getElementById("statusDot");
        const telemetry = document.getElementById("telemetry");
        const inputBar = document.getElementById("inputBar");
        const cmdInput = document.getElementById("cmdInput");
        const visRing = document.getElementById("visRing");

        // Build 28 radiating audio visualizer bars around the arc reactor
        const barCount = 28;
        const radius = 112;
        const bars = [];
        for (let i = 0; i < barCount; i++) {
            const bar = document.createElement("div");
            bar.className = "audio-bar";
            const angle = (i / barCount) * (Math.PI * 2);
            const x = Math.cos(angle) * radius;
            const y = Math.sin(angle) * radius;
            const deg = (angle * 180 / Math.PI) + 90;
            bar.style.transform = `translate(${x}px, ${y}px) rotate(${deg}deg)`;
            visRing.appendChild(bar);
            bars.push(bar);
        }

        let subtitleTimeout = null;

        function showSubtitle(text, duration = 4500) {
            subtitles.innerText = text;
            subtitles.classList.add("visible");
            clearTimeout(subtitleTimeout);
            if (duration > 0) {
                subtitleTimeout = setTimeout(() => {
                    subtitles.classList.remove("visible");
                }, duration);
            }
        }

        function setVisualState(state, label) {
            reactor.className = "reactor-box " + state;
            statusText.innerText = label;
            if (state === "listening") {
                statusDot.style.background = "#ff3b30";
                statusDot.style.boxShadow = "0 0 10px #ff3b30";
            } else if (state === "thinking") {
                statusDot.style.background = "#00f0ff";
                statusDot.style.boxShadow = "0 0 10px #00f0ff";
            } else if (state === "speaking") {
                statusDot.style.background = "#ffaa00";
                statusDot.style.boxShadow = "0 0 10px #ffaa00";
            } else {
                statusDot.style.background = "#00ffaa";
                statusDot.style.boxShadow = "0 0 8px #00ffaa";
            }
        }

        // Animate audio bars when speaking or listening
        function animateVisualizer(active, isSpeaking) {
            for (let i = 0; i < bars.length; i++) {
                if (active) {
                    const h = isSpeaking ? (8 + Math.random() * 16) : (6 + Math.random() * 10);
                    bars[i].style.height = h + "px";
                    bars[i].style.background = isSpeaking ? "#ffaa00" : "#ff3b30";
                } else {
                    bars[i].style.height = "5px";
                    bars[i].style.background = "rgba(255, 170, 0, 0.4)";
                }
            }
        }

        let currentActiveState = "idle";
        setInterval(() => {
            if (currentActiveState === "speaking" || currentActiveState === "listening") {
                animateVisualizer(true, currentActiveState === "speaking");
            } else {
                animateVisualizer(false, false);
            }
        }, 90);

        // Poll Python backend for live speech & state
        let lastState = "";
        let lastText = "";
        async function syncState() {
            try {
                const res = await fetch("/api/widget_state");
                const data = await res.json();
                if (data) {
                    const state = data.state || "idle";
                    const text = data.text || "";
                    currentActiveState = state;

                    if (state !== lastState || text !== lastText) {
                        lastState = state;
                        lastText = text;
                        if (state === "listening") {
                            setVisualState("listening", "LISTENING...");
                            showSubtitle(text || "🎙️ Listening... speak anytime", 0);
                        } else if (state === "thinking") {
                            setVisualState("thinking", "THINKING...");
                            showSubtitle(text || "⚡ Executing command...", 0);
                        } else if (state === "speaking") {
                            setVisualState("speaking", "SPEAKING...");
                            showSubtitle(text, 6000);
                        } else {
                            setVisualState("idle", "JARVIS // ONLINE");
                        }
                    }
                }
            } catch(e) {}
        }
        setInterval(syncState, 200);

        async function handleCommand(query) {
            setVisualState("thinking", "THINKING...");
            showSubtitle("⚡ Executing: " + query, 0);

            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: query })
                });
                const data = await res.json();
                const reply = (data && data.response) ? data.response : "Done, Sir.";

                setVisualState("speaking", "SPEAKING...");
                showSubtitle(reply, 6000);
            } catch (err) {
                setVisualState("idle", "JARVIS // ONLINE");
            }
        }

        function toggleInput() {
            if (inputBar.style.display === "block") {
                inputBar.style.display = "none";
            } else {
                focusInput();
            }
        }

        function focusInput() {
            inputBar.style.display = "block";
            setTimeout(() => {
                cmdInput.focus();
            }, 50);
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.widget) {
                window.webkit.messageHandlers.widget.postMessage({ action: "focus" });
            }
        }

        // --- BUTTERY SMOOTH DESKTOP DRAGGING TO ANY PLACE ---
        let isDragging = false;
        let startX = 0;
        let startY = 0;

        function attachDrag(el) {
            if (!el) return;
            el.addEventListener("mousedown", (e) => {
                if (e.target.tagName === "BUTTON" || e.target.tagName === "INPUT" || e.target.closest(".input-bar")) return;
                isDragging = true;
                startX = e.screenX;
                startY = e.screenY;
            });
        }

        const hudHeaderEl = document.querySelector(".hud-header");
        attachDrag(hudHeaderEl);
        attachDrag(reactor);

        window.addEventListener("mousemove", (e) => {
            if (!isDragging) return;
            const dx = e.screenX - startX;
            const dy = e.screenY - startY;
            startX = e.screenX;
            startY = e.screenY;
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.widget) {
                window.webkit.messageHandlers.widget.postMessage({ action: "move", dx: dx, dy: dy });
            }
        });

        window.addEventListener("mouseup", () => {
            isDragging = false;
        });

        cmdInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && cmdInput.value.trim()) {
                const val = cmdInput.value.trim();
                cmdInput.value = "";
                inputBar.style.display = "none";
                handleCommand(val);
            } else if (e.key === "Escape") {
                inputBar.style.display = "none";
            }
        });

        function askQuick(text) {
            handleCommand(text);
        }

        // Live telemetry updates
        async function updateStats() {
            try {
                const res = await fetch("/api/stats");
                const d = await res.json();
                if (d && d.status === "success") {
                    const cpu = d.cpu ? d.cpu.estimated_utilization : "0%";
                    const batt = d.battery ? d.battery.percent : "100%";
                    telemetry.innerText = `CPU ${cpu} | ${batt}⚡`;
                }
            } catch(e) {}
        }
        setInterval(updateStats, 4000);
        updateStats();

        window.addEventListener("DOMContentLoaded", () => {
            showSubtitle("J.A.R.V.I.S. Holographic Matrix Online", 3500);
        });
    </script>
</body>
</html>
