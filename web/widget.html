<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Void Holographic Core</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-void: #000000;
            --surface-glass: rgba(12, 14, 20, 0.78);
            --surface-border: rgba(255, 255, 255, 0.12);
            --surface-border-bright: rgba(255, 255, 255, 0.28);
            --accent-white: #ffffff;
            --accent-cyan: #38bdf8;
            --accent-purple: #c084fc;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.55);
            --font-ui: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
            --font-display: "Space Grotesk", sans-serif;
            --font-mono: "JetBrains Mono", monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        html, body {
            width: 100%;
            height: 100%;
            background: transparent !important;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: var(--font-ui);
            -webkit-app-region: no-drag;
        }

        .widget-container {
            width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding: 6px;
        }

        /* Top HUD Telemetry Pill */
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 270px;
            padding: 6px 14px;
            background: var(--surface-glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--surface-border);
            border-radius: 9999px;
            font-family: var(--font-display);
            font-size: 9.5px;
            letter-spacing: 1.2px;
            color: var(--text-primary);
            margin-bottom: 4px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.25s ease;
            cursor: grab;
        }
        .hud-header:active {
            cursor: grabbing;
            border-color: var(--surface-border-bright);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 10px #10b981;
            display: inline-block;
            transition: all 0.3s ease;
        }

        #statusText {
            font-weight: 700;
            letter-spacing: 1.2px;
        }

        #telemetry {
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        /* 3D Hologram Particle Sphere Stage */
        .hologram-stage {
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            border-radius: 50%;
        }
        .hologram-stage:active {
            cursor: grabbing;
        }

        .hologram-canvas {
            width: 240px;
            height: 240px;
            display: block;
            border-radius: 50%;
            pointer-events: auto;
        }

        /* Core Starlight Ambient Contrast Backdrop */
        .ambient-glow {
            position: absolute;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 0, 0, 0.75) 0%, rgba(0, 0, 0, 0.48) 58%, transparent 82%);
            pointer-events: none;
            transition: all 0.4s ease;
        }

        /* Subtitle Pill */
        .subtitles {
            width: 270px;
            padding: 6px 12px;
            background: rgba(10, 12, 16, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            font-size: 11px;
            color: var(--text-primary);
            text-align: center;
            line-height: 1.4;
            letter-spacing: 0.2px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(4px);
            transition: all 0.25s ease;
            pointer-events: none;
            margin-top: 4px;
            margin-bottom: 6px;
            word-break: break-word;
        }
        .subtitles.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Quick Command Input Bar */
        .input-bar {
            display: none;
            width: 270px;
            background: rgba(14, 17, 24, 0.95);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--surface-border-bright);
            border-radius: 12px;
            padding: 8px 12px;
            margin-bottom: 8px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
        }
        .input-bar input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-family: var(--font-ui);
            font-size: 12.5px;
            font-weight: 500;
        }
        .input-bar input::placeholder {
            color: var(--text-secondary);
        }

        /* Button Action Row */
        .btn-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 270px;
            margin-top: 2px;
        }

        .pill-btn {
            flex: 1;
            padding: 6px 4px;
            background: var(--surface-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--surface-border);
            border-radius: 10px;
            color: var(--text-secondary);
            font-family: var(--font-display);
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.18s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }
        .pill-btn:hover {
            color: #ffffff;
            border-color: var(--surface-border-bright);
            background: rgba(255, 255, 255, 0.08);
        }
        .pill-btn:active {
            transform: scale(0.95);
        }

        .pill-btn.recording {
            border-color: #ef4444;
            color: #ef4444;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
            animation: pulse-rec 1.2s infinite;
        }
        @keyframes pulse-rec {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }
    </style>
</head>
<body>
    <div class="widget-container">
        <!-- Top HUD Telemetry Header (Draggable) -->
        <div class="hud-header" id="hudHeader" title="Drag to move Void widget anywhere on desktop">
            <div class="status-badge">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">VOID // ONLINE</span>
            </div>
            <div id="telemetry">CPU 0% | 100%⚡</div>
        </div>

        <!-- 3D Holographic Particle Sphere -->
        <div class="hologram-stage" id="hologramStage" title="Swipe or drag to orbit Void in 3D • Click to mute/type">
            <div class="ambient-glow" id="ambientGlow"></div>
            <canvas id="voidHologramCanvas" class="hologram-canvas"></canvas>
        </div>

        <!-- Subtitle Pill -->
        <div class="subtitles" id="subtitles">Standing by, Sir.</div>

        <!-- Quick Command Input -->
        <div class="input-bar" id="inputBar">
            <input type="text" id="cmdInput" placeholder="Command Void... (Enter to send)" />
        </div>

        <!-- Quick Action Buttons -->
        <div class="btn-row">
            <button class="pill-btn" onclick="toggleInput()">⌨️ TYPE</button>
            <button class="pill-btn" id="recBtn" onclick="toggleScreenRecording()" title="Screen Recording">🎥 REC</button>
            <button class="pill-btn" onclick="askQuick('what is on my screen right now')" title="Visual scan of screen">👁️ SCAN</button>
            <button class="pill-btn" onclick="askQuick('solve the coding problem on screen and paste it')" title="Solve coding problem">⚡ CODE</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("voidHologramCanvas");
        const ctx = canvas.getContext("2d");
        const statusText = document.getElementById("statusText");
        const statusDot = document.getElementById("statusDot");
        const telemetry = document.getElementById("telemetry");
        const subtitles = document.getElementById("subtitles");
        const inputBar = document.getElementById("inputBar");
        const cmdInput = document.getElementById("cmdInput");
        const ambientGlow = document.getElementById("ambientGlow");
        const hudHeader = document.getElementById("hudHeader");
        const hologramStage = document.getElementById("hologramStage");

        // High-DPI canvas setup
        const dpr = window.devicePixelRatio || 2;
        const STAGE_SIZE = 240;
        canvas.width = STAGE_SIZE * dpr;
        canvas.height = STAGE_SIZE * dpr;
        ctx.scale(dpr, dpr);

        // 3D Point-Cloud Holographic Sphere (4,800 Enhanced Particles)
        const PARTICLE_COUNT = 4800;
        const particles = [];
        const SPHERE_RADIUS = 88;
        const LATITUDE_BANDS = 24;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const rnd = Math.random();
            let x, y, z, baseSize, baseAlpha;

            if (rnd < 0.36) {
                // 1. DENSE POLAR CAPS (North & South poles)
                // 36% of particles form misty, bright white caps at top & bottom
                const isNorth = Math.random() < 0.5;
                const poleFactor = Math.pow(Math.random(), 2.3);
                const yNorm = isNorth ? (1.0 - poleFactor * 0.32) : (-1.0 + poleFactor * 0.32);
                const ringR = Math.sqrt(Math.max(0, 1 - yNorm * yNorm));
                const phi = Math.random() * Math.PI * 2;
                
                // Volumetric polar depth
                const rVar = SPHERE_RADIUS * (0.95 + Math.random() * 0.08);
                x = Math.cos(phi) * ringR * rVar;
                y = yNorm * rVar;
                z = Math.sin(phi) * ringR * rVar;
                
                baseSize = 0.75 + Math.random() * 0.95;
                baseAlpha = 0.65 + Math.random() * 0.35;
            } else if (rnd < 0.90) {
                // 2. STRUCTURED SHELL WITH CLEAR HORIZONTAL LATITUDE STRATA
                // 54% of particles distributed along the body & equator for high clarity
                const u = Math.random();
                const rawY = 2 * u - 1;
                const bandedY = Math.round(rawY * LATITUDE_BANDS) / LATITUDE_BANDS;
                const yNorm = rawY * 0.60 + bandedY * 0.40; // clean snap to latitude lines
                const ringR = Math.sqrt(Math.max(0, 1 - yNorm * yNorm));
                const phi = Math.random() * Math.PI * 2;

                const rVar = SPHERE_RADIUS * (0.97 + Math.random() * 0.05);
                x = Math.cos(phi) * ringR * rVar;
                y = yNorm * rVar;
                z = Math.sin(phi) * ringR * rVar;

                baseSize = 0.68 + Math.random() * 0.85;
                baseAlpha = 0.45 + Math.random() * 0.55;
            } else {
                // 3. INTERIOR ATMOSPHERIC DUST
                // Volumetric interior dust for 3D depth and parallax while rotating
                const phi = Math.random() * Math.PI * 2;
                const theta = Math.acos(2 * Math.random() - 1);
                const rVar = SPHERE_RADIUS * (0.25 + Math.random() * 0.70);

                x = rVar * Math.sin(theta) * Math.cos(phi);
                y = rVar * Math.cos(theta);
                z = rVar * Math.sin(theta) * Math.sin(phi);

                baseSize = 0.50 + Math.random() * 0.65;
                baseAlpha = 0.30 + Math.random() * 0.40;
            }

            particles.push({
                origX: x,
                origY: y,
                origZ: z,
                size: baseSize,
                alpha: baseAlpha,
                phase: Math.random() * Math.PI * 2
            });
        }

        let rotX = 0.30; // Natural planetary tilt
        let rotY = 0;
        let velX = 0.0006;
        let velY = 0.0035;
        let isOrbitDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let hasDraggedSignificantly = false;

        let activeState = "idle";
        let stateAnimTime = 0;
        let subtitleTimeout = null;

        // Interactive 3D Sphere Orbit Dragging
        hologramStage.addEventListener("mousedown", (e) => {
            isOrbitDragging = true;
            hasDraggedSignificantly = false;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            velX = 0;
            velY = 0;
        });

        window.addEventListener("mousemove", (e) => {
            if (!isOrbitDragging) return;
            const dx = e.clientX - dragStartX;
            const dy = e.clientY - dragStartY;
            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                hasDraggedSignificantly = true;
            }
            velY = dx * 0.005;
            velX = -dy * 0.005;
            rotY += velY;
            rotX += velX;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
        });

        window.addEventListener("mouseup", (e) => {
            if (isOrbitDragging && !hasDraggedSignificantly) {
                // Tap sphere: mute if speaking, or activate microphone and listen if idle!
                if (activeState === "speaking") {
                    fetch("/api/stop", { method: "POST" });
                    setVisualState("idle", "VOID // ONLINE");
                } else {
                    fetch("/api/listen");
                }
            }
            isOrbitDragging = false;
        });

        // 60 FPS Render Loop
        function render() {
            ctx.clearRect(0, 0, STAGE_SIZE, STAGE_SIZE);

            if (!isOrbitDragging) {
                rotY += velY;
                rotX += velX;
                velY = velY * 0.94 + 0.0035 * 0.06;
                velX = velX * 0.94 + 0.0008 * 0.06;
            }

            stateAnimTime += 0.035;
            const cx = STAGE_SIZE / 2;
            const cy = STAGE_SIZE / 2;

            let radiusMultiplier = 1.0;
            let speedMod = 1.0;
            let waveFreq = 2.0;

            if (activeState === "listening") {
                radiusMultiplier = 1.0 + Math.sin(stateAnimTime * 8) * 0.08;
                waveFreq = 8.0;
            } else if (activeState === "thinking") {
                speedMod = 3.5;
                radiusMultiplier = 0.92 + Math.sin(stateAnimTime * 12) * 0.05;
            } else if (activeState === "speaking") {
                radiusMultiplier = 1.04 + Math.sin(stateAnimTime * 6) * 0.06;
                waveFreq = 4.0;
            } else if (activeState === "sleep" || activeState === "shutdown") {
                radiusMultiplier = 0.65;
                speedMod = 0.3;
            } else {
                radiusMultiplier = 1.0 + Math.sin(stateAnimTime * 1.5) * 0.025;
            }

            const cosY = Math.cos(rotY * speedMod);
            const sinY = Math.sin(rotY * speedMod);
            const cosX = Math.cos(rotX);
            const sinX = Math.sin(rotX);

            const projected = [];

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                let wave = 1.0;
                if (activeState !== "sleep" && activeState !== "shutdown") {
                    wave += Math.sin(p.phase + stateAnimTime * waveFreq) * 0.035;
                }

                const px = p.origX * radiusMultiplier * wave;
                const py = p.origY * radiusMultiplier * wave;
                const pz = p.origZ * radiusMultiplier * wave;

                // 3D Matrix Rotation (Y then X)
                const x1 = px * cosY - pz * sinY;
                const z1 = pz * cosY + px * sinY;

                const y2 = py * cosX - z1 * sinX;
                const z2 = z1 * cosX + py * sinX;

                // Perspective projection
                const fov = 300;
                const scale = fov / (fov + z2);
                const screenX = cx + x1 * scale;
                const screenY = cy + y2 * scale;

                const depthAlpha = ((z2 + SPHERE_RADIUS) / (SPHERE_RADIUS * 2));
                const finalAlpha = Math.max(0.35, Math.min(1.0, p.alpha * (0.52 + depthAlpha * 0.48)));

                projected.push({
                    x: screenX,
                    y: screenY,
                    z: z2,
                    size: p.size * scale,
                    alpha: finalAlpha
                });
            }

            projected.sort((a, b) => a.z - b.z);

            for (let i = 0; i < projected.length; i++) {
                const p = projected[i];
                const s = Math.max(0.85, p.size);

                let colorPrefix = "255, 255, 255";
                if (activeState === "listening") colorPrefix = "56, 189, 248";
                else if (activeState === "thinking") colorPrefix = "192, 132, 252";

                ctx.fillStyle = `rgba(${colorPrefix}, ${p.alpha})`;
                ctx.fillRect(p.x - s * 0.5, p.y - s * 0.5, s, s);

                // Subtle starlight bloom on bright foreground points
                if (p.alpha > 0.82 && s > 1.1) {
                    ctx.fillStyle = `rgba(${colorPrefix}, ${p.alpha * 0.28})`;
                    ctx.fillRect(p.x - s * 1.1, p.y - s * 1.1, s * 2.2, s * 2.2);
                }
            }

            requestAnimationFrame(render);
        }
        render();

        // UI State Updates
        function setVisualState(state, label) {
            activeState = state;
            statusText.innerText = label || "VOID // ONLINE";

            if (state === "listening") {
                statusDot.style.background = "#38bdf8";
                statusDot.style.boxShadow = "0 0 10px #38bdf8";
                ambientGlow.style.background = "radial-gradient(circle, rgba(56, 189, 248, 0.22) 0%, rgba(56, 189, 248, 0.08) 50%, transparent 75%)";
            } else if (state === "thinking") {
                statusDot.style.background = "#c084fc";
                statusDot.style.boxShadow = "0 0 10px #c084fc";
                ambientGlow.style.background = "radial-gradient(circle, rgba(192, 132, 252, 0.22) 0%, rgba(192, 132, 252, 0.08) 50%, transparent 75%)";
            } else if (state === "speaking") {
                statusDot.style.background = "#ffffff";
                statusDot.style.boxShadow = "0 0 12px #ffffff";
                ambientGlow.style.background = "radial-gradient(circle, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.08) 50%, transparent 75%)";
            } else if (state === "sleep" || state === "shutdown") {
                statusDot.style.background = "rgba(255, 255, 255, 0.25)";
                statusDot.style.boxShadow = "none";
                ambientGlow.style.background = "none";
            } else {
                statusDot.style.background = "#10b981";
                statusDot.style.boxShadow = "0 0 8px #10b981";
                ambientGlow.style.background = "radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, rgba(56, 189, 248, 0.04) 40%, transparent 70%)";
            }
        }

        function showSubtitle(text, duration = 4500) {
            subtitles.innerText = text;
            subtitles.classList.add("visible");
            clearTimeout(subtitleTimeout);
            if (duration > 0) {
                subtitleTimeout = setTimeout(() => {
                    subtitles.classList.remove("visible");
                }, duration);
            }
        }

        // Poll Python backend for live speech & state
        let lastState = "";
        let lastText = "";
        async function syncState() {
            try {
                const res = await fetch("/api/widget_state");
                const data = await res.json();
                if (data) {
                    const state = data.state || "idle";
                    const text = data.text || "";

                    if (state !== lastState || text !== lastText) {
                        lastState = state;
                        lastText = text;
                        if (state === "sleep" || state === "shutdown") {
                            setVisualState("sleep", "STANDBY");
                            showSubtitle("Entering standby mode, Sir.", 2500);
                            setTimeout(() => {
                                if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.widget) {
                                    window.webkit.messageHandlers.widget.postMessage({ action: "sleep" });
                                }
                            }, 400);
                        } else if (state === "listening") {
                            setVisualState("listening", "LISTENING...");
                            showSubtitle(text || "🎙️ Listening... speak anytime", 0);
                        } else if (state === "thinking") {
                            setVisualState("thinking", "THINKING...");
                            showSubtitle(text || "⚡ Processing instruction...", 0);
                        } else if (state === "speaking") {
                            setVisualState("speaking", "SPEAKING...");
                            showSubtitle(text, 6000);
                        } else {
                            setVisualState("idle", "VOID // ONLINE");
                        }
                    }
                }
            } catch(e) {}
        }
        setInterval(syncState, 200);

        async function handleCommand(query) {
            setVisualState("thinking", "THINKING...");
            showSubtitle("⚡ Executing: " + query, 0);

            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: query })
                });
                const data = await res.json();
                const reply = (data && data.response) ? data.response : "Done, Sir.";

                setVisualState("speaking", "SPEAKING...");
                showSubtitle(reply, 6000);
            } catch (err) {
                setVisualState("idle", "VOID // ONLINE");
            }
        }

        function toggleInput() {
            if (inputBar.style.display === "block") {
                inputBar.style.display = "none";
            } else {
                focusInput();
            }
        }

        function focusInput() {
            inputBar.style.display = "block";
            setTimeout(() => {
                cmdInput.focus();
            }, 50);
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.widget) {
                window.webkit.messageHandlers.widget.postMessage({ action: "focus" });
            }
        }

        cmdInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && cmdInput.value.trim()) {
                const val = cmdInput.value.trim();
                cmdInput.value = "";
                inputBar.style.display = "none";
                handleCommand(val);
            } else if (e.key === "Escape") {
                inputBar.style.display = "none";
            }
        });

        function askQuick(text) {
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.widget) {
                window.webkit.messageHandlers.widget.postMessage({ action: "unfocus" });
            }
            handleCommand(text);
        }

        // Desktop window drag handler via HUD Header
        let isWindowDragging = false;
        let winStartX = 0;
        let winStartY = 0;

        hudHeader.addEventListener("mousedown", (e) => {
            isWindowDragging = true;
            winStartX = e.screenX;
            winStartY = e.screenY;
        });

        window.addEventListener("mousemove", (e) => {
            if (!isWindowDragging) return;
            const dx = e.screenX - winStartX;
            const dy = e.screenY - winStartY;
            winStartX = e.screenX;
            winStartY = e.screenY;
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.widget) {
                window.webkit.messageHandlers.widget.postMessage({ action: "move", dx: dx, dy: dy });
            }
        });

        window.addEventListener("mouseup", () => {
            isWindowDragging = false;
        });

        // Screen recording toggle
        let isScreenRecording = false;
        async function toggleScreenRecording() {
            const btn = document.getElementById("recBtn");
            if (!isScreenRecording) {
                isScreenRecording = true;
                if (btn) {
                    btn.innerText = "⏹️ STOP";
                    btn.classList.add("recording");
                }
                handleCommand("start screen recording");
            } else {
                isScreenRecording = false;
                if (btn) {
                    btn.innerText = "🎥 REC";
                    btn.classList.remove("recording");
                }
                handleCommand("stop screen recording");
            }
        }

        // Live telemetry updates
        async function updateStats() {
            try {
                const res = await fetch("/api/stats");
                const d = await res.json();
                if (d && d.status === "success") {
                    const cpu = d.cpu ? d.cpu.estimated_utilization : "0%";
                    const batt = d.battery ? d.battery.percent : "100%";
                    telemetry.innerText = `CPU ${cpu} | ${batt}⚡`;
                }
            } catch(e) {}
        }
