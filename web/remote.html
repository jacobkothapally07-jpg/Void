<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pocket J.A.R.V.I.S.</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #ff9900;
            --gold-bright: #ffaa00;
            --gold-glow: rgba(255, 150, 0, 0.6);
            --cyan: #00f0ff;
            --cyan-glow: rgba(0, 240, 255, 0.6);
            --bg: #05070a;
            --card-bg: rgba(15, 23, 42, 0.75);
            --border: rgba(255, 170, 0, 0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 150, 0, 0.15) 0%, transparent 60%);
            color: #f1f5f9;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }

        header {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 20px;
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            flex-direction: column;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--gold-bright);
            text-shadow: 0 0 12px var(--gold-glow);
        }

        .subtitle {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 1px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 255, 170, 0.1);
            border: 1px solid rgba(0, 255, 170, 0.3);
            padding: 4px 10px;
            border-radius: 12px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: #00ffaa;
        }

        .dot {
            width: 7px;
            height: 7px;
            background: #00ffaa;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ffaa;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .btn-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #f8fafc;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .btn-card:active {
            transform: scale(0.96);
            border-color: var(--gold-bright);
            box-shadow: 0 0 16px var(--gold-glow);
        }

        .btn-card .icon {
            font-size: 26px;
        }

        .chat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            backdrop-filter: blur(10px);
        }

        .messages {
            height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 14px;
            padding-right: 4px;
        }

        .msg {
            padding: 8px 12px;
            border-radius: 10px;
            line-height: 1.4;
            max-width: 90%;
            word-wrap: break-word;
        }

        .msg.user {
            align-self: flex-end;
            background: rgba(255, 170, 0, 0.2);
            border: 1px solid rgba(255, 170, 0, 0.4);
            color: #ffdd88;
        }

        .msg.jarvis {
            align-self: flex-start;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: #bbf2f6;
        }

        .input-bar {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff;
            padding: 12px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: var(--gold-bright);
            box-shadow: 0 0 10px var(--gold-glow);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--gold), #d97706);
            border: none;
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            border-radius: 10px;
            padding: 0 18px;
            cursor: pointer;
        }

        .preview-box {
            display: none;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--cyan);
            box-shadow: 0 0 16px var(--cyan-glow);
            margin-top: 8px;
        }

        .preview-box img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <div class="title">J.A.R.V.I.S.</div>
            <div class="subtitle">POCKET MOBILE BRIDGE // JK INDUSTRIES</div>
        </div>
        <div class="status-badge">
            <div class="dot"></div>
            <span>LINKED</span>
        </div>
    </header>

    <div class="container">
        <div class="grid">
            <button class="btn-card" onclick="sendCommand('screenshot')">
                <div class="icon">📸</div>
                <span>SCREENSHOT</span>
            </button>
            <button class="btn-card" onclick="sendCommand('camera')">
                <div class="icon">👁️</div>
                <span>DESK SENTRY</span>
            </button>
            <button class="btn-card" onclick="sendCommand('lock workstation')">
                <div class="icon">🔒</div>
                <span>LOCK MAC</span>
            </button>
            <button class="btn-card" onclick="sendCommand('battery health')">
                <div class="icon">🔋</div>
                <span>BATTERY</span>
            </button>
        </div>

        <div id="previewBox" class="preview-box">
            <img id="previewImg" src="" alt="Capture">
        </div>

        <div class="chat-card">
            <div class="messages" id="messagesBox">
                <div class="msg jarvis">Pocket J.A.R.V.I.S. online, Sir. Remote channel secured. What are your orders?</div>
            </div>
            <div class="input-bar">
                <input type="text" id="cmdInput" placeholder="Command J.A.R.V.I.S..." onkeydown="if(event.key==='Enter') sendText()">
                <button class="send-btn" onclick="sendText()">SEND</button>
            </div>
        </div>
    </div>

    <script>
        const CMD_TOPIC = "jk_jarvis_cmd";
        const REPLY_TOPIC = "jk_jarvis_reply";

        const messagesBox = document.getElementById("messagesBox");
        const cmdInput = document.getElementById("cmdInput");
        const previewBox = document.getElementById("previewBox");
        const previewImg = document.getElementById("previewImg");

        function addMessage(text, isUser = false) {
            const div = document.createElement("div");
            div.className = "msg " + (isUser ? "user" : "jarvis");
            div.innerText = text;
            messagesBox.appendChild(div);
            messagesBox.scrollTop = messagesBox.scrollHeight;
        }

        async function sendCommand(cmd) {
            addMessage(cmd, true);
            try {
                await fetch(`https://ntfy.sh/${CMD_TOPIC}`, {
                    method: "POST",
                    body: cmd
                });
            } catch(e) {
                addMessage("Failed to dispatch command: " + e.message, false);
            }
        }

        function sendText() {
            const text = cmdInput.value.trim();
            if (!text) return;
            cmdInput.value = "";
            sendCommand(text);
        }

        // Listen for live replies from your Mac
        const eventSource = new EventSource(`https://ntfy.sh/${REPLY_TOPIC}/sse`);
        eventSource.onmessage = function(event) {
            try {
                const data = JSON.parse(event.data);
                if (data.event === "message") {
                    if (data.attachment && data.attachment.url) {
                        previewImg.src = data.attachment.url;
                        previewBox.style.display = "block";
                        previewBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                    if (data.message && !data.message.startsWith("You received a file:")) {
                        addMessage(data.message, false);
                    }
                }
            } catch(e) {}
        };
    </script>
</body>
</html>
